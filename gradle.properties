#Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
org.gradle.parallel=true

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4G
kotlin.native.binary.gc=cms
kotlin.incremental.wasm=true
kotlin.js.yarn=false

# NOTE: `kotlin.js.ir.output.granularity=per-file` is intentionally NOT set.
# It emits one .mjs per Kotlin source file (vs. the default `per-module`)
# which in theory lets consumer bundlers tree-shake at finer grain. In
# practice for THIS library it has two problems:
#   1. The auto-generated umbrella `stockholm-transport.mjs` re-exports
#      per-file modules with `export *`, but `export *` does NOT propagate
#      a `default` export (ECMAScript rule). With `@JsExport.Default` on
#      `StockholmTransportApi`, `import api from '@scope/...'` fails to
#      resolve at the umbrella entry.
#   2. The tarball grows substantially (~857 kB → ~1.1 MB) and the file
#      count explodes (~72 → ~1351 files in node_modules).
# Stays as the default (per-module) until upstream propagates default
# exports through `export *` or we ship a hand-written umbrella that does.
# Reference: kotlinlang.org/docs/js-ir-compiler.html ("Output granularity")

